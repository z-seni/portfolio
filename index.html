    <!-- Gallery renderer -->
    <script src="js/gallery-data.js"></script>
    <script>
      (function() {
        var container = document.querySelector('.row.alime-portfolio');
        var delays = ['100ms','200ms','300ms','400ms','500ms','600ms','700ms','800ms'];
        var html = '';
        Object.keys(GALLERY_ITEMS).forEach(function(cat) {
          GALLERY_ITEMS[cat].forEach(function(file, i) {
            var src = 'img/bg-img/' + cat + '/' + file;
            html += '<div class="col-12 col-sm-6 col-lg-3 single_gallery_item ' + cat + ' mb-30 wow fadeInUp" data-wow-delay="' + delays[i % delays.length] + '">'
              + '<div class="single-portfolio-content">'
              + '<img loading="lazy" src="' + src + '" alt="">'
              + '<div class="hover-content"><a href="' + src + '" class="portfolio-img">+</a></div>'
              + '</div></div>';
          });
        });
        container.innerHTML = html;
      })();
    </script>
