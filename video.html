    <script>
      function ytThumb(url) {
        var m = url.match(/[?&]v=([^&]+)/);
        return m ? 'https://img.youtube.com/vi/' + m[1] + '/maxresdefault.jpg' : null;
      }

      function fmtViews(n) {
        if (!n) return '';
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M likes';
        if (n >= 1000)    return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k likes';
        return n + ' likes';
      }

      var container = document.getElementById('video-categories');

      VIDEO_CATEGORIES.forEach(function(cat) {
        var col = cat.small ? 'col-6 col-sm-4 col-lg-2' : 'col-12 col-sm-6 col-lg-3';
        var colLandscape = 'col-12 col-sm-6 col-lg-3';
        var areaClass = cat.small ? 'about-video-area about-video-area--small' : 'about-video-area';
        var videos = cat.videos.map(function(v) {
          var thumb = v.thumb || ytThumb(v.url) || '';
          var vCol = (cat.small && v.landscape) ? colLandscape : col;
          var vAreaClass = (cat.small && v.landscape) ? 'about-video-area' : areaClass;
          var urlKey = v.url.replace(/\/?$/, '/');
          return '<div class="' + vCol + ' mb-30">'
            + '<div class="' + vAreaClass + '">'
            + '<img loading="lazy" src="' + thumb + '" alt="' + cat.label + '">'
            + '<div class="video-icon">'
            + '<a href="' + v.url + '" target="_blank" rel="noopener"><i class="arrow_triangle-right"></i></a>'
            + '</div></div>'
            + '<p class="video-title">' + v.title + '</p>'
            + '<p class="video-views" data-url="' + urlKey + '"></p>'
            + '</div>';
        }).join('');

        container.innerHTML +=
          '<div class="video-cat-row">'
          + '<div class="video-cat-label"><h5>' + cat.label + '</h5></div>'
          + '<div class="video-cat-items row">' + videos + '</div>'
          + '</div>';
      });

      if (typeof VIDEO_STATS !== 'undefined') {
        document.querySelectorAll('.video-views').forEach(function(el) {
          var url = el.getAttribute('data-url');
          var count = VIDEO_STATS[url] || VIDEO_STATS[url.replace(/\/$/, '')];
          if (count) el.textContent = fmtViews(count);
        });
      }
    </script>
